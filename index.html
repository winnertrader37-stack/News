function fromFeed(x){const c=(CATS.find(k=>k[0].test(x.title))||[0,"other"])[1];
 return {id:x.id,utc:x.utc,impact:x.impact,pairs:x.pairs||["XAUUSD","BTCUSD","ETHUSD"],ok:true,f:x.forecast,p:x.previous,a:x.actual,t:{om:x.title,am:x.title,en:x.title},n:INFO[c]}}
async function loadFeed(){try{const r=await fetch("events.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
 const j=await r.json(),arr=Array.isArray(j)?j:j.events;if(!arr)throw 0;
 const nv=arr.map(fromFeed);if(j.rules)for(const k of["high","medium","low"])if(typeof j.rules[k]==="number")BUF[k]=j.rules[k];
 if(PREV)nv.forEach(e=>{if(!PREV.has(e.id)){NEWSET.add(e.id);if(S&&e.impact==="high"){beep(e.impact);speak(UI[L].nwS+e.t[L])}}});
 PREV=new Set(nv.map(e=>e.id));EVENTS=nv;FEED_AT=j.updated?new Date(j.updated):new Date(0)}catch(e){if(!FEED_AT)EVENTS=FALLBACK.slice()}}

const WD={om:["Wiixata","Kibxata","Roobii","Kamisa","Jimaata","Sanbata","Dilbata"],am:["ሰኞ","ማክሰኞ","ረቡዕ","ሐሙስ","አርብ","ቅዳሜ","እሑድ"],en:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]};
const MO={om:["Fuulbana","Onkololeessa","Sadaasa","Muddee","Amajjii","Guraandhala","Bitooteessa","Ebla","Caamsaa","Waxabajjii","Adoolessa","Hagayya","Paagume"],
 am:["መስከረም","ጥቅምት","ኅዳር","ታኅሣሥ","ጥር","የካቲት","መጋቢት","ሚያዝያ","ግንቦት","ሰኔ","ሐምሌ","ነሐሴ","ጳጉሜን"],
 en:["Meskerem","Tikimt","Hidar","Tahsas","Tir","Yekatit","Megabit","Miazia","Ginbot","Sene","Hamle","Nehase","Pagume"]};
const VL={om:["om","sw","it","en"],am:["am","en"],en:["en"]}; /* sagalee: Oromoo yoo hin jirre sw/it/en */
const p2=n=>String(n).padStart(2,"0");
const eat=d=>new Date(d.getTime()+3*3600e3);
function ethDate(d){const e=eat(d),y=e.getUTCFullYear(),m=e.getUTCMonth()+1,dd=e.getUTCDate();
 const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
 const j=dd+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;
 const r=(j-1723856)%1461,n=r%365+365*Math.floor(r/1460);
 return {y:4*Math.floor((j-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30),d:n%30+1}}
const ethClock=d=>{const e=eat(d);return (((e.getUTCHours()-6+24)%12)||12)+":"+p2(e.getUTCMinutes())};
function fmt(d,L){const e=eat(d),g=ethDate(d);
 return WD[L][(e.getUTCDay()+6)%7]+" "+g.d+" "+MO[L][g.m]+" "+g.y+" · "+p2(e.getUTCDate())+"/"+p2(e.getUTCMonth()+1)+"/"+e.getUTCFullYear()+" · "+p2(e.getUTCHours())+":"+p2(e.getUTCMinutes())+" EAT ("+ethClock(d)+")"}
function spoken(d,L){const e=eat(d),g=ethDate(d);return WD[L][(e.getUTCDay()+6)%7]+" "+g.d+" "+MO[L][g.m]+", "+p2(e.getUTCHours())+":"+p2(e.getUTCMinutes())+" EAT"}
const parts=ms=>{const s=Math.max(0,Math.floor(Math.abs(ms)/1000));return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]};

let L="om",P="ALL",I="ALL",S=false,lastKey="",PREV=null;const NEWSET=new Set(),DOT={high:"🔴",medium:"🟠",low:"🟢"},ORD={high:0,medium:1,low:2};const done={};
try{L=localStorage.getItem("lang")||"om"}catch(e){}
const TTS=window.speechSynthesis;if(TTS){TTS.getVoices();TTS.onvoiceschanged=()=>TTS.getVoices()}
function speak(text){if(!TTS)return;TTS.cancel();const vs=TTS.getVoices();let v=null;
 for(const c of VL[L]){v=vs.find(x=>x.lang.toLowerCase().replace("_","-").startsWith(c));if(v)break}
 const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang}else u.lang=VL[L][0];u.rate=.95;TTS.speak(u)}
function beep(imp){try{const A=window._ac;if(!A)return;const n=imp==="high"?3:imp==="medium"?2:1,f=imp==="high"?880:imp==="medium"?660:440;
 for(let k=0;k<n;k++){const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(A.destination);o.start(A.currentTime+k*.3);o.stop(A.currentTime+k*.3+.18)}
 if(navigator.vibrate)navigator.vibrate(imp==="high"?[200,100,200,100,200]:[200])}catch(e){}}
function readEvent(e){const i=e.n[L];speak(e.t[L].replace("✱","")+". "+spoken(new Date(e.utc),L)+". "+i.w+" "+i.u+" "+i.d+" "+i.t)}

function setupBtns(){
 document.getElementById("lang").innerHTML=[["om","Afaan Oromo"],["am","አማርኛ"],["en","English"]].map(x=>`<button data-l="${x[0]}" class="${L===x[0]?"on":""}">${x[1]}</button>`).join("");
 document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}if(TTS)TTS.cancel();setupBtns();render(true)});
 document.getElementById("pf").innerHTML=["ALL","XAUUSD","BTCUSD","ETHUSD"].map(p=>`<button data-p="${p}" class="${P===p?"on":""}">${p==="ALL"?UI[L].all:p}</button>`).join("");
 document.querySelectorAll("#pf button").forEach(b=>b.onclick=()=>{P=b.dataset.p;setupBtns();render(true)});
 document.getElementById("pi").innerHTML=["ALL","high","medium","low"].map(k=>`<button data-i="${k}" class="${I===k?"on":""}">${k==="ALL"?UI[L].all:DOT[k]+" "+UI[L].imp[k]+" ("+EVENTS.filter(e=>e.impact===k&&new Date(e.utc)-new Date()<=SHOW_DAYS*864e5&&new Date(e.utc)-new Date()>-3*36e5).length+")"}</button>`).join("");
 document.querySelectorAll("#pi button").forEach(b=>b.onclick=()=>{I=b.dataset.i;setupBtns();render(true)});
 const s=document.getElementById("snd");s.className="snd"+(S?" on":"");s.textContent=S?UI[L].s0:UI[L].s1}
document.getElementById("snd").onclick=()=>{try{window._ac=window._ac||new (window.AudioContext||window.webkitAudioContext)();window._ac.resume()}catch(e){}S=!S;setupBtns();if(S)speak(UI[L].unlock);else if(TTS)TTS.cancel()};
document.getElementById("list").onclick=ev=>{const c=ev.target.closest(".ev");if(!c)return;
 if(TTS&&TTS.speaking){TTS.cancel();return}readEvent(EVENTS.find(e=>e.id===c.dataset.id))};
document.getElementById("list").onpointermove=ev=>{document.querySelectorAll(".ev").forEach(c=>c.style.transform="");const c=ev.target.closest(".ev");if(!c)return;const r=c.getBoundingClientRect();
 c.style.transform=`rotateY(${((ev.clientX-r.left)/r.width-.5)*8}deg) rotateX(${-((ev.clientY-r.top)/r.height-.5)*8}deg)`};
document.getElementById("list").onpointerleave=()=>document.querySelectorAll(".ev").forEach(c=>c.style.transform="");

function render(force){const now=new Date(),U=UI[L],e0=eat(now);
 document.getElementById("now").textContent=p2(e0.getUTCHours())+":"+p2(e0.getUTCMinutes())+":"+p2(e0.getUTCSeconds())+" EAT";
 document.getElementById("ec").textContent=U.ec+ethClock(now)+" · "+fmt(now,L).split(" · ")[0];
 document.getElementById("dl").textContent=U.dl;document.getElementById("foot").textContent=U.foot;
 let block=null;
 EVENTS.forEach(e=>{const b=BUF[e.impact]*6e4,t=new Date(e.utc)-now;if(b&&t<b&&t>-b)block=e});
 const st=document.getElementById("st");st.className=block?"stop":"ok";st.textContent=block?U.stop+" · "+block.t[L]:U.ok;
 const fd=document.getElementById("fd");
 if(!FEED_AT){fd.textContent="📡 "+U.fNone;fd.style.color="#ffb020"}
 else{const m=Math.floor((now-FEED_AT)/6e4);fd.textContent="📡 "+(m>60?U.fOld:U.fOk)+" · "+m+" min";fd.style.color=m>60?"#ff7a8a":"#6be3b0"}
 if(S)EVENTS.forEach(e=>{const t=new Date(e.utc)-now;
  if(t>0&&t<=6e5&&!done[e.id+"a"]){done[e.id+"a"]=1;beep(e.impact);speak(U.pre+e.t[L].replace("✱",""))}
  if(t<=0&&t>-2e4&&!done[e.id+"b"]){done[e.id+"b"]=1;beep(e.impact);readEvent(e)}});
 const vis=EVENTS.filter(e=>{const t=new Date(e.utc)-now;return t<=SHOW_DAYS*864e5&&t>-3*36e5&&(P==="ALL"||e.pairs.includes(P))&&(I==="ALL"||e.impact===I)}).sort((a,b)=>ORD[a.impact]-ORD[b.impact]||new Date(a.utc)-new Date(b.utc));
 const key=L+P+I+vis.map(e=>e.id+e.a+(NEWSET.has(e.id)?"n":"")).join();
 if(force||key!==lastKey){lastKey=key;let prevI="";let h=vis.map(e=>{const bm=BUF[e.impact],i=e.n[L];const hd=e.impact!==prevI?`<div class="grp">${DOT[e.impact]} ${U.imp[e.impact]} (${vis.filter(x=>x.impact===e.impact).length})</div>`:"";prevI=e.impact;
  return hd+`<div class="ev ${e.impact}" data-id="${e.id}"><span class="pill">${U.imp[e.impact]}</span>${NEWSET.has(e.id)?`<span class="pill new">${U.nw}</span>`:""}${e.pairs.map(p=>`<span class="pill">${p}</span>`).join("")}
  <h2>${e.t[L]}</h2><div class="when">${fmt(new Date(e.utc),L)}</div>
  <div class="when" style="margin-top:8px"><b class="lbl" data-id="${e.id}"></b>:</div>
  <div class="tiles">${[U.d,U.h,U.m,U.s].map((x,k)=>`<div class="tile"><b class="cdv" data-id="${e.id}" data-i="${k}">00</b><span>${x}</span></div>`).join("")}</div>
  <div class="info">${e.f!=null||e.p!=null||e.a!=null?`<p>📊 ${U.fc}: ${e.f??"–"} · ${U.pv}: ${e.p??"–"} · ${U.ac}: ${e.a??"–"}</p>`:""}<p>📖 ${i.w}</p><p>📈 ${i.u}</p><p>📉 ${i.d}</p><p>💡 ${i.t}</p></div>
  <div class="bot">${bm?U.bot(bm):U.nobot}</div><div class="hint">${U.hint}</div></div>`}).join("");
  if(!vis.length){const nx=EVENTS.filter(e=>new Date(e.utc)>now&&(P==="ALL"||e.pairs.includes(P))).sort((a,b)=>new Date(a.utc)-new Date(b.utc))[0];
   h=`<div class="empty">📭 ${U.none}${nx?`<div class="mut" style="margin-top:8px">${U.next}${fmt(new Date(new Date(nx.utc)-SHOW_DAYS*864e5),L)}</div>`:""}</div>`}
  document.getElementById("list").innerHTML=h}
 EVENTS.forEach(e=>{const t=new Date(e.utc)-now,c=parts(t);
  document.querySelectorAll(`.cdv[data-id="${e.id}"]`).forEach(b=>b.textContent=p2(c[b.dataset.i]));
  document.querySelectorAll(`.lbl[data-id="${e.id}"]`).forEach(b=>b.textContent=t>0?U.left:U.gone)})}
document.getElementById("dl").onclick=()=>{const o=EVENTS.map(e=>({id:e.id,title:e.t.en,utc:e.utc,impact:e.impact,pairs:e.pairs,block_minutes:BUF[e.impact]}));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download="news-events.json";a.click()};
setupBtns();render(true);loadFeed().then(()=>render(true));setInterval(()=>render(false),1000);setInterval(loadFeed,60000);
